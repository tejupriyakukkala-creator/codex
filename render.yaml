services:
  # Option 1: Fast Global Static Site (Free Tier)
  - type: web
    name: medtwin-ai-static
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Option 2: Docker Web Service Container
  - type: web
    name: medtwin-ai-docker
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
